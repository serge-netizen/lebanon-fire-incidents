name: backfill
# Manual only (task 6): crawls outlet archives month by month.
on:
  workflow_dispatch:
    inputs:
      months:
        description: "How many months back"
        default: "24"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run crawler --dry-run
