name: backfill
# Task 6: the two-year history for the sources GitHub reads (crawler/backfill.py). The crawl does a
# little of it every run; run this by hand for a longer push. The owner's Mac does the same for
# its sources (scripts/home-crawl.sh). Same group as the crawl: the two never write at once.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time for this run, shared between the sources"
        default: "120"

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Check out private store
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.PRIVATE_DATA_REPO }}
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private
      - name: Collect the history
        env:
          MINUTES: ${{ inputs.minutes }}
        run: uv run crawler backfill --where github --minutes "$MINUTES"
      - name: Save article text to the private store
        working-directory: private
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw state
          if ! git diff --cached --quiet; then
            git commit -q -m "backfill $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q
          fi
