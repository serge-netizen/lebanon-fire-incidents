name: crawl
# Three runs a day at 06:00, 13:00 and 20:00 Beirut.
# GitHub cron is UTC and has no time zones: 03/10/17 UTC is exact in summer (UTC+3)
# and one hour early in winter (UTC+2). Chosen so the evening run never slips past midnight.
# Minute 17, not 0: GitHub delays and drops scheduled runs most at the top of the hour
# (measured 2026-10-10 → 22: runs started 3–7 h late; see docs/BUILD_PLAN.md §8).
on:
  schedule:
    - cron: "17 3,10,17 * * *"
  workflow_dispatch:

permissions:
  contents: write   # to commit data/published/ once publishing exists (task 5)

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_PRIVATE: ${{ secrets.PRIVATE_DATA_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      # The private store (raw article text, run state) is a second, private repo.
      # Until the PRIVATE_DATA_TOKEN secret exists, this run only dry-runs.
      - name: Check out private store
        if: ${{ env.HAS_PRIVATE == 'true' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.PRIVATE_DATA_REPO }}
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private
      - name: Crawl (dry run until adapters land in task 3)
        run: uv run crawler --dry-run
