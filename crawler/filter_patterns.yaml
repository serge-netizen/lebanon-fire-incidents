# Keyword filter (BRIEF §3), applied to a headline plus the first 300 characters of text.
# UTF-8 data, never strings in code (BRIEF §11). Patterns are matched after folding: diacritics
# removed, alef forms unified (أ إ آ → ا), ى → ي, lower case — so write them either way.

# Any of these sends an article on to extraction (BRIEF §3, verbatim).
match:
  - "حريق|حرائق|اندل(?:ع|اع) حريق|إخماد|أخمد|تخمد|النيران|نيران تشتعل|اشتعال|احتراق|حرقاً|حرقًا|التهمت|تلتهم|السيطرة على الحريق|احتواء حريق|تجدد الحريق|بؤرة|فوج (?:إطفاء|الإطفاء)|الدفاع المدني|ماس كهربائي|قارورة غاز|مولد|حالات اختناق"
  - "fire (?:broke|breaks) out|blaze|brought under control|extinguish|civil defen[cs]e|asphyxiation|gas canister"
  - "incendie|feu (?:s'est déclaré|a éclaté)|maîtrisé|défense civile"

# Borderline words: passed to the model too (BRIEF §4.2).
borderline:
  - "انفجار|دخان|اختناق"

# Figurative fire, risk bulletins, military fire (BRIEF §3). Flagged, not dropped: the model
# decides, because a strike can start a real fire.
exclude:
  - "نيران العدو|تحت نيران|إطلاق نار|قصف"
  - "تشعل الغضب|يشعل جدلاً"
  - "نشرة إحتمال إندلاع حرائق|موجة الحر"
  - "cease-?fire|gunfire|opened fire|under fire|exchange of fire|fireworks?"

# War words (owner, 2026-10-23: war-related fires are logged but out of scope). A second check
# after Claude's: a fire in Lebanon that Claude did not mark war-related, in an article with any
# of these words, is flagged for review — never dropped. Matched anywhere in headline and text.
# "انفجار" is left out on purpose: gas and battery explosions are civil fires. "غارة" must start
# a word (after و ف ب ل ك or ال), so "مغارة" (a cave) does not count; "العدوى" (infection) neither.
war:
  - "(?<!\\w)[وفبلك]{0,2}(?:ال)?غار(?:ة|ات)|العدو(?!ى)|قصف|قذيفة|قذائف|صاروخ|صواريخ|مسيرة|الاحتلال|إسرائيل|ذخائر|ذخيرة|قنبلة|قنابل|عنقودية|فوسفور|تفجير|لغم|ألغام|استهداف|استهدف|اليونيفيل"
  - "\\bisrael|airstrike|air strike|drone strike|shelling|\\bmissiles?\\b|\\brockets?\\b|munitions|ordnance|unifil"
  - "israélien|\\bfrappes?\\b|bombardement|\\bobus\\b|finul"

# Narrower sets used by the source census (task 3) to tell fire stories from the rest.
census:
  fire: "حريق|حرائق|إخماد|أخمد|تخمد|النيران|نيران|اشتعال|احتراق|التهمت|تلتهم|\\bfires?\\b|\\bblazes?\\b|wildfires?|\\bincendies?\\b|feux? de forêt"
  tally: "مهم(?:ة|ات|ه) خلال|missions? (?:in|over) the (?:past|last) 24"
