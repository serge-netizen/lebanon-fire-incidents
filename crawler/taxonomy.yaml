# Classification of a fire incident — DRAFT 0.3 (2026-10-23), after the owner's second review.
#
# One fire = one record, built in this order (each step needs the one before it):
#   0. SCOPE      a fire? in Lebanon? caused by war?         record_type, is_lebanon, `origins`
#                 War-related fires are logged with every field but not displayed (owner,
#                 2026-10-23). Code adds a second check: war words in the article (filter_patterns.yaml).
#   1. WHERE      the place on the map                       place_text → the gazetteer (crawler/geocode.py)
#   2. SAME FIRE  several articles, one fire                  crawler/dedupe.py (needs WHERE and SITE)
#   3. SITE       which facility or place witnessed the fire  `site_types`
#   4. BURNED     what was burning                            `materials`
#   5. HAZARD     what started or fed it                      `hazards`
#   6. ORIGIN     accident, deliberate, war, or unknown       `origins`
#   7. DAMAGE     deaths, injuries, buildings, area…          `damages`
#
# SITE, BURNED and HAZARD answer separate questions and never repeat each other: a generator
# fire in a school's yard is site `education`, burned `generator_unit` + `diesel_fuel_oil`,
# hazard `generator`. The site is the premises or land, never the thing that burned: a car on
# a highway is site `road`, burned `car`.
#
# REPORTED or DEDUCED — every value is one or the other (owner, 2026-10-23):
# - reported: Claude read it in the article and quotes the words as evidence;
# - deduced:  code looks it up in a fixed table at the end of this file — what a kind of site
#             usually contains (`typical_materials`) or usually starts fires (`typical_hazards`),
#             the origin a hazard implies (`origin_from_hazard`) — and the district of a village
#             (gazetteer), the publication date when the fire date is not given.
# Claude never deduces. Deduced values are shown apart, labelled, and never counted as reported.
#
# Tags: one MAIN value plus up to FOUR others for site, burned and hazard; counts use the main
# one. `not_established` closes each list: the article does not say. That is an answer.
# Built from NFIRS (US national fire reporting; codes from NFPA 901: "PU" Property Use, "IT"
# Incident Type) and NFPA 10's fire classes, simplified and adapted to Lebanon. Codes are to be
# checked against the NFIRS 5.0 reference guide before the published schema is fixed. `cues` are
# Arabic words that point to an entry; they help, they do not decide.

site_types:
  # ---- buildings and facilities
  residential:
    label: Residential
    definition: Where people live or stay overnight.
    subtypes:
      house: {label: "House or villa", nfirs: "PU 419", cues: [منزل, بيت, فيلا, دار]}
      apartment_building: {label: "Apartment building", nfirs: "PU 429", cues: [مبنى سكني, بناية, شقة]}
      hotel: {label: "Hotel, guesthouse or furnished apartments", nfirs: "PU 449", cues: [فندق, شقق مفروشة]}
      refugee_camp: {label: "Refugee camp (built)", cues: [مخيم عين الحلوة, مخيم البداوي], rule: "Palestinian camps: dense built areas"}
      informal_settlement: {label: "Informal tented settlement", cues: [خيم النازحين, تجمع للنازحين], rule: "Tents of displaced people, mostly Syrian"}
      other_residential: {label: "Other residential (dormitory, barracks)", nfirs: "PU 460"}
  shops:
    label: Shops, malls and markets
    definition: Places that sell goods.
    subtypes:
      shop: {label: "Shop, supermarket or showroom", nfirs: "PU 500", cues: [محل, متجر, سوبرماركت, معرض]}
      shopping_mall: {label: "Shopping mall", cues: [مول, مجمع تجاري], rule: "A building of many shops; one shop inside it is `shop` as another tag"}
      market: {label: "Market or stalls", cues: [سوق, بسطات]}
      commercial_building: {label: 'Commercial building or "centre", use not stated', cues: [سنتر, مبنى تجاري], rule: "Only when the article does not say what the building holds"}
  food_drink:
    label: Restaurants and cafés
    definition: Places that prepare or serve food and drink.
    subtypes:
      restaurant: {label: "Restaurant or snack", nfirs: "PU 161", cues: [مطعم, سناك]}
      cafe_bar: {label: "Café, bar or nightclub", nfirs: "PU 162", cues: [مقهى, كافيه, ملهى]}
      bakery: {label: "Bakery or pastry shop", cues: [فرن, أفران, حلويات], rule: "It bakes on site, so it belongs here rather than in shops"}
  offices:
    label: Offices and banks
    definition: Places of office work.
    subtypes:
      office: {label: "Office or company premises", nfirs: "PU 599", cues: [مكتب, شركة]}
      bank: {label: "Bank or money exchange", nfirs: "PU 592", cues: [مصرف, بنك, صيرفة]}
  light_industry:
    label: Light industry and workshops
    definition: Making or repairing finished goods, at small or medium scale.
    rule: "Producing or processing chemicals, plastics, foam, rubber, metal or building materials in bulk is heavy industry"
    subtypes:
      workshop: {label: "Workshop or repair garage", cues: [ورشة, كاراج, منجرة, محدادة], rule: "Car repair garages belong here"}
      food_processing: {label: "Food or drink factory", cues: [معمل ألبان, معمل حلويات, مطحنة]}
      textile_clothing: {label: "Textile or clothing factory", cues: [معمل خياطة, معمل أقمشة]}
      furniture_wood: {label: "Furniture or wood factory", cues: [معمل مفروشات, معمل خشب]}
      printing_packaging: {label: "Printing or packaging plant", cues: [مطبعة, معمل كرتون]}
      factory_unspecified: {label: "Factory, product not stated", nfirs: "PU 700", cues: [معمل, مصنع], rule: "Only when the article does not say what is made"}
  heavy_industry:
    label: Heavy industry
    definition: Producing or processing bulk or hazardous materials at large scale.
    subtypes:
      chemicals_plastics: {label: "Chemicals, paint, plastics, foam or rubber plant", cues: [معمل اسفنج, معمل بلاستيك, معمل دهانات, معمل كيميائي]}
      recycling: {label: "Recycling plant (plastic, paper, metal)", cues: [معمل تدوير, إعادة تدوير]}
      metal: {label: "Metal works or foundry", cues: [معمل حديد, مسبك]}
      building_materials: {label: "Cement, asphalt or concrete plant", cues: [معمل إسمنت, معمل زفت, معمل باطون]}
      quarry: {label: "Quarry, crusher or sand pit", nfirs: "PU 679", cues: [مقلع, كسارة, مرملة]}
  storage:
    label: Storage and yards
    definition: Places that keep goods or materials.
    subtypes:
      warehouse: {label: "Warehouse or depot for goods", nfirs: "PU 891", cues: [مستودع, مخزن]}
      industrial_storage: {label: "Industrial storage (raw materials, chemicals, timber, pallets)", nfirs: "PU 807", cues: [مواد أولية, مستودع مواد كيميائية, مستودع أخشاب], rule: "Fuel and gas storage is `fuel_gas_storage`"}
      scrap_yard: {label: "Scrap or salvage yard", cues: [بورة, خردة, كسر]}
  energy_fuel:
    label: Energy and fuel sites
    definition: Places that produce, store or sell energy — among Lebanon's most frequent and dangerous fire sites.
    subtypes:
      fuel_station: {label: "Fuel station", nfirs: "PU 571", cues: [محطة محروقات, محطة وقود]}
      generator_site: {label: "Generator installation or room", cues: [غرفة المولد, مولدات الاشتراك], rule: "Only when the generator installation is itself the premises; a generator inside a house, school or shop is site house, school or shop, with hazard `generator`"}
      electricity_network: {label: "Electricity network (plant, substation, transformer, cables)", nfirs: "PU 642", cues: [محول, شبكة الكهرباء, معمل الكهرباء]}
      fuel_gas_storage: {label: "Fuel or gas storage and distribution", nfirs: "PU 645", cues: [خزانات, مستودع غاز, تعبئة الغاز, خط النفط]}
  public_institutional:
    label: Public and institutional buildings
    definition: Government, education, health, worship and security.
    subtypes:
      government: {label: "Government or municipal building", nfirs: "PU 150", cues: [سراي, بلدية, وزارة]}
      education: {label: "School, university or nursery", nfirs: "PU 200", cues: [مدرسة, ثانوية, جامعة, معهد, حضانة]}
      health: {label: "Hospital, clinic or care home", nfirs: "PU 300", cues: [مستشفى, مستوصف, دار للعجزة]}
      worship: {label: "Place of worship", nfirs: "PU 131", cues: [مسجد, جامع, كنيسة, دير]}
      security: {label: "Military, police or prison site", nfirs: "PU 631", cues: [ثكنة, مركز للجيش, مخفر, سجن]}
  assembly_leisure:
    label: Halls, sport and entertainment
    definition: Places where people gather for events or leisure.
    subtypes:
      event_hall: {label: "Event or wedding hall", cues: [صالة, قاعة]}
      sports: {label: "Stadium, gym or club", nfirs: "PU 120", cues: [ملعب, نادي]}
      entertainment: {label: "Cinema, theatre or amusement park", nfirs: "PU 180", cues: [سينما, مسرح, مدينة ملاهي]}
  waste_sites:
    label: Waste sites
    definition: Places built or used for waste. The waste itself is what burned.
    subtypes:
      dump: {label: "Dump or landfill", nfirs: "PU 919", cues: [مكب, مطمر, جبل النفايات]}
      waste_plant: {label: "Waste sorting or treatment plant", cues: [معمل فرز, معمل معالجة النفايات]}
  # ---- outdoor places
  natural_areas:
    label: Natural areas
    definition: Land nobody cultivates. The trees or grass are what burned.
    subtypes:
      forest: {label: "Forest or woodland", nfirs: "PU 669", cues: [أحراج, حرج, غابة]}
      scrubland: {label: "Scrubland", nfirs: "PU 931", cues: [شجيرات, أشجار برية, أحراش]}
      grassland: {label: "Grassland, hillside or valley", nfirs: "PU 931", cues: [وادي, تلة, أرض بور, سهل], rule: "Open natural land; a plot inside a town is `vacant_lot`"}
  agricultural:
    label: Farmland and farms
    definition: Land and buildings used to grow crops or raise animals.
    subtypes:
      field_crops: {label: "Field (crops)", nfirs: "PU 655", cues: [حقل, أراض زراعية, سهل زراعي]}
      orchard: {label: "Orchard or olive grove", nfirs: "PU 655", cues: [بستان, بساتين, زيتون, كروم]}
      greenhouse_nursery: {label: "Greenhouse or plant nursery", cues: [خيم بلاستيكية, مشتل]}
      farm_building: {label: "Barn, hay store or animal farm", nfirs: "PU 659", cues: [مزرعة, حظيرة, مزرعة دواجن]}
  public_spaces:
    label: Roads, public spaces and open land
    definition: Streets, public places and open land in or near towns.
    subtypes:
      road: {label: "Road, street or roadside", nfirs: "PU 960", cues: [طريق, أوتوستراد, شارع]}
      tunnel_bridge: {label: "Tunnel or bridge", nfirs: "PU 922", cues: [نفق, جسر]}
      transport_hub: {label: "Port, airport or bus station", nfirs: "PU 170", cues: [مرفأ, مطار, محطة باصات]}
      parking: {label: "Car park", nfirs: "PU 965", cues: [موقف, مرأب]}
      park_square: {label: "Public park, garden or square", cues: [حديقة عامة, ساحة]}
      beach_riverbank: {label: "Beach, sea or riverbank", nfirs: "PU 937", cues: [شاطئ, البحر, ضفاف النهر, مجرى النهر]}
      vacant_lot: {label: "Vacant lot in a town", nfirs: "PU 936", cues: [أرض فارغة, عقار, قطعة أرض]}
      construction_site: {label: "Construction site", nfirs: "PU 981", cues: [ورشة بناء, مشروع قيد الإنشاء]}
  not_established:
    label: Not established
    definition: The article does not say what kind of place burned.

# What was burning: objects and materials. `fire_class` follows NFPA 10: A ordinary solids,
# B flammable liquids and gases, C live electrical equipment, D combustible metals, K cooking oil.
materials:
  building_contents:
    label: Building and contents
    items:
      building_structure: {label: "Roof, walls or structure", fire_class: A, cues: [سطح, سقف, قرميد, هيكل]}
      furniture_upholstery: {label: "Furniture and upholstery", fire_class: A, cues: [مفروشات, أثاث, كنبايات]}
      mattresses_bedding: {label: "Mattresses and bedding", fire_class: A, cues: [فرش, فرشات, أغطية]}
      textiles_clothing: {label: "Textiles and clothing", fire_class: A, cues: [ملابس, أقمشة, سجاد, ستائر]}
      goods_stock: {label: "Goods and stock, mixed", fire_class: A, cues: [بضائع, محتويات]}
  wood_paper_plastics:
    label: Wood, paper and plastics
    items:
      wood_timber: {label: "Wood and timber", fire_class: A, cues: [خشب, أخشاب, حطب]}
      paper_cardboard: {label: "Paper and cardboard", fire_class: A, cues: [ورق, كرتون]}
      plastics_nylon: {label: "Plastics and nylon", fire_class: A, cues: [بلاستيك, نايلون]}
      foam_sponge: {label: "Foam and sponge", fire_class: A, cues: [اسفنج, فلين]}
      rubber_tyres: {label: "Rubber and tyres", fire_class: A, cues: [دواليب, إطارات, مطاط]}
  vegetation:
    label: Vegetation
    items:
      trees_shrubs: {label: "Trees and shrubs", fire_class: A, cues: [أشجار, شجيرات, صنوبر, سنديان, زيتون]}
      dry_grass_weeds: {label: "Dry grass and weeds", fire_class: A, cues: [أعشاب يابسة, أعشاب, عشب]}
      crops_grain: {label: "Crops and grain", fire_class: A, cues: [قمح, محاصيل, شعير]}
      hay_straw: {label: "Hay and straw", fire_class: A, cues: [تبن, قش]}
  waste:
    label: Waste
    items:
      household_rubbish: {label: "Household rubbish", fire_class: A, cues: [نفايات, مستوعب نفايات]}
      industrial_waste: {label: "Industrial or construction waste", fire_class: A, cues: [نفايات صناعية, ردميات]}
      scrap: {label: "Scrap and salvage", fire_class: A, cues: [خردة, كسر]}
  vehicles:
    label: Vehicles
    items:
      car: {label: "Car, pick-up or SUV", fire_class: "A, B", nfirs: "IT 131", cues: [سيارة, رباعية الدفع, بيك اب]}
      truck: {label: "Truck or tanker", fire_class: "A, B", nfirs: "IT 132", cues: [شاحنة, صهريج], rule: "Pick-ups are `car`, as in NFIRS"}
      bus_van: {label: "Bus, minibus or van", fire_class: "A, B", cues: [باص, فان, حافلة]}
      motorcycle: {label: "Motorcycle or scooter", fire_class: "A, B", cues: [دراجة نارية]}
      boat: {label: "Boat or ship", fire_class: "A, B", nfirs: "IT 134", cues: [مركب, باخرة, سفينة]}
      aircraft: {label: "Aircraft", fire_class: "A, B", nfirs: "IT 135", cues: [طائرة]}
      machinery: {label: "Construction or farm machinery", fire_class: "A, B", nfirs: "IT 138", cues: [جرافة, حفارة, جرار زراعي]}
  fuels_liquids:
    label: Fuels and flammable liquids
    items:
      petrol: {label: "Petrol", fire_class: B, cues: [بنزين]}
      diesel_fuel_oil: {label: "Diesel and fuel oil", fire_class: B, cues: [مازوت, فيول]}
      oils_lubricants: {label: "Oils and lubricants", fire_class: B, cues: [زيوت, زيت محركات]}
      paints_solvents: {label: "Paints and solvents", fire_class: B, cues: [دهانات, تنر, مذيبات]}
  gases:
    label: Gases
    items:
      lpg_cylinders: {label: "LPG and gas cylinders", fire_class: B, cues: [قارورة غاز, قوارير غاز, غاز منزلي]}
      industrial_gases: {label: "Industrial or medical gases (oxygen, acetylene)", fire_class: B, cues: [أوكسيجين, أسيتيلين]}
  electrical:
    label: Electrical equipment
    items:
      wiring_cables: {label: "Wiring and cables", fire_class: C, cues: [كابلات, أسلاك, تمديدات]}
      electrical_panels: {label: "Panels, meters and transformers", fire_class: C, cues: [لوحة كهرباء, عداد, محول]}
      appliances_electronics: {label: "Appliances and electronics", fire_class: C, cues: [أجهزة كهربائية, براد, غسالة]}
      batteries: {label: "Batteries", fire_class: C, cues: [بطاريات, بطارية ليثيوم], note: "Lithium batteries need specific agents; NFPA 10 has no class of its own for them"}
      solar_equipment: {label: "Solar panels and inverters", fire_class: C, cues: [ألواح شمسية, انفرتر]}
      generator_unit: {label: "Generator (the machine)", fire_class: "B, C", cues: [مولد, مولد كهربائي]}
  cooking:
    label: Cooking oil
    items:
      cooking_oil_fat: {label: "Cooking oil and fat", fire_class: K, cues: [زيت القلي, زيت الطبخ]}
  chemicals:
    label: Chemicals
    items:
      industrial_chemicals: {label: "Industrial chemicals", fire_class: depends, cues: [مواد كيميائية]}
      pesticides_fertilisers: {label: "Pesticides and fertilisers", fire_class: depends, cues: [مبيدات, أسمدة]}
  metals:
    label: Metals
    items:
      combustible_metals: {label: "Combustible metals (magnesium, aluminium dust)", fire_class: D}
  explosives:
    label: Explosives
    items:
      munitions: {label: "Munitions and ordnance", fire_class: none, cues: [ذخائر, قذائف], note: "War-related: out of scope"}
      pyrotechnics: {label: "Fireworks and flares (as goods)", fire_class: none, cues: [مفرقعات, ألعاب نارية]}

hazards:
  electrical_installation:
    label: Electrical installation
    definition: Wiring, panels, meters, plugs, a short circuit.
    cues: [ماس كهربائي, عطل كهربائي, التمديدات الكهربائية, عداد, لوحة كهرباء]
  electrical_appliance:
    label: Electrical appliance
    definition: A device that plugs in (heater fan, fridge, washing machine, charger).
    rule: "Batteries and solar equipment are `battery_solar`; a vehicle's electrics are `vehicle_fault`"
    cues: [براد, غسالة, شاحن, جهاز كهربائي]
  battery_solar:
    label: Batteries and solar systems
    definition: Lithium or lead batteries, inverters, UPS, solar panels.
    rule: "A battery that explodes is still this hazard"
    cues: [بطارية, بطاريات ليثيوم, طاقة شمسية, ألواح شمسية, انفرتر]
  generator:
    label: Generator
    definition: A private or neighbourhood generator, its room or its own fuel tank.
    cues: [مولد, مولد كهربائي, غرفة المولد]
  fuel_flammable_liquid:
    label: Fuel and flammable liquids
    definition: Diesel, petrol, oil, solvents — stored, transported, spilled or poured.
    rule: "A generator's own tank is `generator`"
    cues: [مازوت, بنزين, محروقات, صهريج, مواد مشتعلة]
  gas:
    label: Gas
    definition: Gas cylinders, gas leaks, gas pipes.
    rule: "A gas cylinder that explodes is still this hazard"
    cues: [قارورة غاز, تسرب غاز, غاز منزلي]
  cooking:
    label: Cooking
    definition: Stoves, ovens, frying oil, commercial kitchens.
    cues: [طبخ, مطبخ, زيت القلي]
  heating:
    label: Heating
    definition: Wood or diesel stoves, heaters, fireplaces, chimneys.
    cues: [صوبيا, مدفأة, شوفاج, موقدة]
  smoking_open_flame:
    label: Smoking and open flame
    definition: Cigarettes, matches, lighters, candles.
    cues: [سيجارة, شمعة, ولاعة, أعقاب السجائر]
  hot_work_industrial:
    label: Hot work and industrial process
    definition: Welding, cutting, grinding, machinery, chemical processes.
    cues: [تلحيم, قص]
  open_burning:
    label: Open burning
    definition: Burning rubbish, stubble or weeds in the open, including when it gets out of hand.
    cues: [حرق النفايات, حرق الأعشاب, تنظيف الأراضي]
  fireworks:
    label: Fireworks and celebratory shooting
    definition: Fireworks, flares fired at celebrations, celebratory gunfire.
    cues: [مفرقعات, ألعاب نارية, إطلاق نار ابتهاجا]
  munitions_explosives:
    label: Munitions and explosives
    definition: Strikes, shelling, drones, military flares, incendiary devices, unexploded ordnance, detonations.
    rule: "War-related: the record is logged but out of scope"
    cues: [غارة, قصف, قذيفة, صاروخ, مسيرة, قنابل مضيئة, تفجير]
  vehicle_fault:
    label: Vehicle fault or crash
    definition: A vehicle's engine, electrics or a collision.
    cues: [عطل في المحرك, عطل تقني, حادث سير, اصطدام]
  natural:
    label: Natural causes
    definition: Lightning, sun and heat, spontaneous combustion (hay, compost).
    cues: [صاعقة, حرارة, اشتعال ذاتي]
  spread_from_another_fire:
    label: Spread from another fire
    definition: The fire came from another fire outside the site (sparks or flames from neighbouring land or a building).
    rule: "A fire that spreads within one article is one record: the places it reached are other sites"
    cues: [امتدت النيران, وصلت النيران]
  not_established:
    label: Not established
    definition: The article does not say what started the fire, or says it is under investigation.
    cues: [مجهولة الأسباب, قيد التحقيق]

# Names as in the brief (§6). Origin is never a hazard: arson with petrol is hazard
# `fuel_flammable_liquid` with origin `deliberate`.
origins:
  accidental: {label: "Accidental", definition: "Not meant to cause damage: a fault, carelessness, or a burning that got out of hand."}
  deliberate: {label: "Deliberate", definition: "Set on purpose to damage or destroy (arson), outside war."}
  conflict_related: {label: "War-related", definition: "Caused by armed hostilities: strikes, shelling, drones, military flares, munitions, fires set by an army, military detonations. Logged, out of scope."}
  unknown: {label: "Unknown", definition: "The article does not say, or says it is under investigation."}

damages:
  deaths: People killed by the fire.
  injuries: People injured (burns, falls), smoke inhalation excluded.
  smoke_inhalation: People treated for smoke inhalation (حالات اختناق).
  buildings_burned: Buildings or homes burned or damaged, as reported.
  vehicles_burned: Vehicles burned.
  area_burned_m2: Area burned, converted to square metres (1 dunum = 1,000 m²; 1 hectare = 10,000 m²).
  displaced: People or families who had to leave their homes (unit as reported).

# ------------------------------------------------------------------ DEDUCED (look-up tables)
# Applied by code to the MAIN site. A sub-type's entry replaces its category's. What is already
# reported is left out. Draft for the owner's review.
typical_materials:
  residential: [furniture_upholstery, mattresses_bedding, textiles_clothing, appliances_electronics, lpg_cylinders]
  informal_settlement: [plastics_nylon, textiles_clothing, mattresses_bedding, lpg_cylinders, wood_timber]
  shops: [goods_stock, plastics_nylon, paper_cardboard, appliances_electronics]
