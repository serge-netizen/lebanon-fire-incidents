[project]
name = "fire-incidents-crawler"
version = "0.1.0"
description = "Pipeline that compiles fire incidents from news reports and official statements into open data."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "anthropic>=0.69",
    "httpx>=0.28",
    "jsonschema[format]>=4.23",
    "pyarrow>=21",
    "pyyaml>=6",
    "rapidfuzz>=3.13",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
# Only NNA and OTV need a real browser (BRIEF §4.3). Kept optional so the
# everyday CI job does not download Chromium.
browser = ["playwright>=1.55"]
# Only needed to rebuild data/gazetteer/lebanon.parquet from the OCHA spreadsheet (task 2).
gazetteer = ["pandas>=2.2", "openpyxl>=3.1"]
# The owner's review workbook (crawler/review.py).
review = ["openpyxl>=3.1"]

[project.scripts]
crawler = "crawler.cli:main"

[dependency-groups]
dev = [
    "openpyxl>=3.1",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
